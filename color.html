<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <link rel="icon" href="style/images/home.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: #131316;
            --surface-hover: #1a1a1f;
            --border: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.1);
            --text: #fafafa;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.3);
        }

        html { font-size: 16px; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            letter-spacing: -0.01em;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
            z-index: 10000;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            background: rgba(9, 9, 11, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo span { width: 6px; height: 6px; background: var(--text); border-radius: 50%; }

        .nav-links { display: flex; gap: 6px; }

        .nav-links a {
            font-size: 13px;
            font-weight: 450;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .nav-links a:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
        .nav-links a.active { color: var(--text); background: rgba(255, 255, 255, 0.06); }

        main {
            padding: 120px 40px 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 60px;
        }

        .page-eyebrow {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }

        .page-desc {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 500px;
        }

        /* Section */
        .section {
            margin-bottom: 64px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Color grid */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .color-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .color-swatch {
            height: 80px;
            position: relative;
        }

        .color-swatch::after {
            content: 'Copy';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .color-card:hover .color-swatch::after {
            opacity: 1;
        }

        .color-info {
            padding: 14px 16px;
        }

        .color-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .color-hex {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Shades */
        .shades-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .shade-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .shade-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .shade-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .shade-name {
            font-size: 14px;
            font-weight: 600;
        }

        .shade-list {
            display: flex;
            gap: 4px;
        }

        .shade {
            flex: 1;
            height: 48px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .shade:hover {
            transform: scale(1.08);
            z-index: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10001;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast svg { color: #22c55e; }

        footer {
            padding: 40px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
        }

        .footer-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            nav { padding: 0 16px; }
            main { padding: 100px 16px 40px; }
            .nav-links { display: none; }
            .shade-list { flex-wrap: wrap; }
            .shade { min-width: 40px; flex: none; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo"><span></span>Dashboard</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="calendar.html">Calendar</a>
            <a href="color.html" class="active">Colors</a>
            <a href="task.html">Tasks</a>
            <a href="MyTime/school_table.html">Schedule</a>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <p class="page-eyebrow">Design Tools</p>
            <h1 class="page-title">Color Palette</h1>
            <p class="page-desc">Curated colors from Material Design and traditional Japanese aesthetics. Click any color to copy.</p>
        </header>

        <section class="section">
            <p class="section-label">Material Colors</p>
            <div class="color-grid" id="primary-colors"></div>
        </section>

        <section class="section">
            <p class="section-label">Color Shades</p>
            <div class="shades-container" id="shades-container"></div>
        </section>

        <section class="section">
            <p class="section-label">Japanese Traditional</p>
            <div class="color-grid" id="japanese-colors"></div>
        </section>
    </main>

    <footer>
        <p class="footer-text">Built with precision</p>
    </footer>

    <div class="toast" id="toast">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toast-text">Copied!</span>
    </div>

    <script>
        const materialColors = [
            { name: 'Red', hex: '#f44336', shades: ['#ffebee', '#ffcdd2', '#ef9a9a', '#e57373', '#ef5350', '#f44336', '#e53935', '#d32f2f', '#c62828', '#b71c1c'] },
            { name: 'Pink', hex: '#e91e63', shades: ['#fce4ec', '#f8bbd9', '#f48fb1', '#f06292', '#ec407a', '#e91e63', '#d81b60', '#c2185b', '#ad1457', '#880e4f'] },
            { name: 'Purple', hex: '#9c27b0', shades: ['#f3e5f5', '#e1bee7', '#ce93d8', '#ba68c8', '#ab47bc', '#9c27b0', '#8e24aa', '#7b1fa2', '#6a1b9a', '#4a148c'] },
            { name: 'Indigo', hex: '#3f51b5', shades: ['#e8eaf6', '#c5cae9', '#9fa8da', '#7986cb', '#5c6bc0', '#3f51b5', '#3949ab', '#303f9f', '#283593', '#1a237e'] },
            { name: 'Blue', hex: '#2196f3', shades: ['#e3f2fd', '#bbdefb', '#90caf9', '#64b5f6', '#42a5f5', '#2196f3', '#1e88e5', '#1976d2', '#1565c0', '#0d47a1'] },
            { name: 'Cyan', hex: '#00bcd4', shades: ['#e0f7fa', '#b2ebf2', '#80deea', '#4dd0e1', '#26c6da', '#00bcd4', '#00acc1', '#0097a7', '#00838f', '#006064'] },
            { name: 'Teal', hex: '#009688', shades: ['#e0f2f1', '#b2dfdb', '#80cbc4', '#4db6ac', '#26a69a', '#009688', '#00897b', '#00796b', '#00695c', '#004d40'] },
            { name: 'Green', hex: '#4caf50', shades: ['#e8f5e9', '#c8e6c9', '#a5d6a7', '#81c784', '#66bb6a', '#4caf50', '#43a047', '#388e3c', '#2e7d32', '#1b5e20'] },
            { name: 'Orange', hex: '#ff9800', shades: ['#fff3e0', '#ffe0b2', '#ffcc80', '#ffb74d', '#ffa726', '#ff9800', '#fb8c00', '#f57c00', '#ef6c00', '#e65100'] },
            { name: 'Grey', hex: '#9e9e9e', shades: ['#fafafa', '#f5f5f5', '#eeeeee', '#e0e0e0', '#bdbdbd', '#9e9e9e', '#757575', '#616161', '#424242', '#212121'] }
        ];

        const japaneseColors = [
            { name: '勿忘草色', hex: '#7bbfea' },
            { name: '露草色', hex: '#33aedc' },
            { name: '缥色', hex: '#228fbd' },
            { name: '桜色', hex: '#fef4f4' },
            { name: '薄紅', hex: '#f0a0a4' },
            { name: '珊瑚色', hex: '#f5a28f' },
            { name: '茜色', hex: '#b7282e' },
            { name: '藤色', hex: '#bbb6da' },
            { name: '若竹色', hex: '#6cba99' },
            { name: '山吹色', hex: '#f8b500' },
            { name: '群青色', hex: '#4c6cb3' },
            { name: '墨色', hex: '#27292a' }
        ];

        function getContrastColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5 ? '#000' : '#fff';
        }

        function copyToClipboard(hex) {
            navigator.clipboard.writeText(hex).then(() => {
                const toast = document.getElementById('toast');
                document.getElementById('toast-text').textContent = `${hex} copied`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function createColorCard(color) {
            const card = document.createElement('div');
            card.className = 'color-card';
            card.onclick = () => copyToClipboard(color.hex);
            card.innerHTML = `
                <div class="color-swatch" style="background: ${color.hex}"></div>
                <div class="color-info">
                    <div class="color-name">${color.name}</div>
                    <div class="color-hex">${color.hex}</div>
                </div>
            `;
            return card;
        }

        function createShadeRow(color) {
            const weights = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
            const row = document.createElement('div');
            row.className = 'shade-row';
            row.innerHTML = `
                <div class="shade-header">
                    <div class="shade-dot" style="background: ${color.hex}"></div>
                    <span class="shade-name">${color.name}</span>
                </div>
                <div class="shade-list">
                    ${color.shades.map((s, i) => `
                        <div class="shade" style="background: ${s}; color: ${getContrastColor(s)}" onclick="copyToClipboard('${s}')">${weights[i]}</div>
                    `).join('')}
                </div>
            `;
            return row;
        }

        // Render
        const primaryGrid = document.getElementById('primary-colors');
        materialColors.forEach(c => primaryGrid.appendChild(createColorCard(c)));

        const shadesContainer = document.getElementById('shades-container');
        materialColors.slice(0, 5).forEach(c => shadesContainer.appendChild(createShadeRow(c)));

        const japaneseGrid = document.getElementById('japanese-colors');
        japaneseColors.forEach(c => japaneseGrid.appendChild(createColorCard(c)));
    </script>
</body>
</html>
