<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar — PerfectQing</title>
    <link rel="icon" href="style/images/home.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #111113;
            --bg-tertiary: #18181b;
            --bg-card: rgba(24, 24, 27, 0.6);
            --bg-card-hover: rgba(39, 39, 42, 0.8);
            --border-primary: rgba(63, 63, 70, 0.4);
            --border-hover: rgba(99, 102, 241, 0.5);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --warning: #f59e0b;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            padding: 24px 0;
            border-bottom: 1px solid var(--border-primary);
            backdrop-filter: blur(12px);
            background: rgba(10, 10, 11, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .brand-text p {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        /* Navigation */
        nav {
            padding: 20px 0;
        }

        nav ul {
            display: flex;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 9999px;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
            border-color: var(--border-primary);
        }

        nav a.active {
            color: var(--accent-light);
            background: var(--accent-glow);
            border-color: var(--border-hover);
        }

        /* Main Content */
        main {
            padding: 48px 0 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
        }

        /* Calendar Card */
        .calendar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            padding: 48px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .calendar-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), #8b5cf6, var(--warning));
        }

        .full-date {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .day-number {
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--warning) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
        }

        .quote-box {
            padding: 20px 24px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-primary);
            margin-bottom: 32px;
        }

        .quote-box p {
            font-size: 15px;
            color: var(--text-secondary);
            font-style: italic;
            line-height: 1.7;
        }

        .countdown-label {
            font-size: 13px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .countdown {
            font-size: 36px;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .countdown span {
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 400;
            margin: 0 4px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 720px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 600;
            color: var(--accent-light);
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        /* Footer */
        .footer {
            padding: 32px 0;
            border-top: 1px solid var(--border-primary);
            text-align: center;
        }

        .footer a {
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--accent-light);
        }

        @media (max-width: 768px) {
            .calendar-card { padding: 32px 24px; }
            .day-number { font-size: 80px; }
            .countdown { font-size: 24px; }
            .stats-row { grid-template-columns: 1fr; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .countdown {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="brand">
                    <div class="logo">PQ</div>
                    <div class="brand-text">
                        <h1>PerfectQing</h1>
                        <p>Calendar</p>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calendar.html" class="active">Calendar</a></li>
                <li><a href="task.html">Tasks</a></li>
                <li><a href="color.html">Colors</a></li>
                <li><a href="MyTime/school_table.html">Schedule</a></li>
                <li><a href="oldindex.html">Archive</a></li>
            </ul>
        </nav>

        <main>
            <div class="calendar-card">
                <div class="full-date" id="fulldate"></div>
                <div class="day-number" id="nowdate"></div>
                <div class="quote-box">
                    <p id="quote"></p>
                </div>
                <div class="countdown-label">Time Remaining Today</div>
                <div class="countdown" id="countdown"></div>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="value" id="week-number">--</div>
                    <div class="label">Week of Year</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="day-of-year">--</div>
                    <div class="label">Day of Year</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="days-left">--</div>
                    <div class="label">Days Left in Year</div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <a href="https://github.com/PerfectQing/PerfectQing.github.io" target="_blank">
                GitHub: PerfectQing/PerfectQing.github.io
            </a>
        </footer>
    </div>

    <script>
        const quotes = [
            "只有登上山顶，才能看到那边的风光",
            "山路曲折盘旋，但毕竟朝着顶峰延伸",
            "勤奋是你生命的密码，能译出你一部壮丽的史诗",
            "左右一个人成功的，不是能力，而是选择",
            "我们这个世界，从不会给一个伤心的落伍者颁发奖牌",
            "没有天生的信心，只有不断培养的信心",
            "每一发奋努力的背后，必有加倍的赏赐",
            "不要等待机会，而要创造机会",
            "含泪播种的人一定能含笑收获",
            "让信念坚持下去，梦想就会实现",
            "不要给自己的失败找借口",
            "要学会新东西，要不断进步，就必须放低自己的姿势"
        ];

        const dayArr = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

        function init() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const date = now.getDate();
            const hours = now.getHours();

            // Full date
            document.getElementById('fulldate').textContent = 
                `${year} 年 ${month + 1} 月 ${date} 日  ${dayArr[now.getDay()]}`;

            // Day number
            document.getElementById('nowdate').textContent = date;

            // Quote based on hour
            document.getElementById('quote').textContent = quotes[Math.floor(hours / 2)];

            // Week number
            const startOfYear = new Date(year, 0, 1);
            const days = Math.floor((now - startOfYear) / (24 * 60 * 60 * 1000));
            document.getElementById('week-number').textContent = Math.ceil((days + startOfYear.getDay() + 1) / 7);

            // Day of year
            document.getElementById('day-of-year').textContent = days + 1;

            // Days left in year
            const endOfYear = new Date(year, 11, 31);
            const daysLeft = Math.ceil((endOfYear - now) / (24 * 60 * 60 * 1000));
            document.getElementById('days-left').textContent = daysLeft;
        }

        function updateCountdown() {
            const now = new Date();
            const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
            const ms = Math.max(0, endOfDay - now);

            const h = Math.floor(ms / (1000 * 60 * 60));
            const m = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((ms % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerHTML = 
                `${String(h).padStart(2, '0')}<span>h</span>${String(m).padStart(2, '0')}<span>m</span>${String(s).padStart(2, '0')}<span>s</span>`;

            // Update quote every minute
            if (s === 0) {
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                document.getElementById('quote').textContent = randomQuote;
            }
        }

        init();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
