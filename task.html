<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="icon" href="style/images/home.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: #131316;
            --surface-hover: #1a1a1f;
            --border: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.1);
            --text: #fafafa;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.3);
            --success: #22c55e;
            --danger: #ef4444;
        }

        html { font-size: 16px; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            letter-spacing: -0.01em;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
            z-index: 10000;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            background: rgba(9, 9, 11, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo span { width: 6px; height: 6px; background: var(--text); border-radius: 50%; }

        .nav-links { display: flex; gap: 6px; }

        .nav-links a {
            font-size: 13px;
            font-weight: 450;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .nav-links a:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
        .nav-links a.active { color: var(--text); background: rgba(255, 255, 255, 0.06); }

        main {
            padding: 120px 40px 100px;
            max-width: 700px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 48px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .page-header-left {}

        .page-eyebrow {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .stats {
            display: flex;
            gap: 16px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
        }

        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        /* Input */
        .task-input-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            transition: border-color 0.2s;
        }

        .task-input-wrapper:focus-within {
            border-color: var(--border-hover);
        }

        .task-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text);
            outline: none;
        }

        .task-input::placeholder {
            color: var(--text-muted);
        }

        .add-btn {
            padding: 12px 24px;
            background: var(--text);
            border: none;
            border-radius: 8px;
            color: var(--bg);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        /* Task list */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s ease;
        }

        .task-item:hover {
            border-color: var(--border-hover);
        }

        .task-item.completed {
            opacity: 0.5;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--border-hover);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .checkbox:hover {
            border-color: var(--text-secondary);
        }

        .task-item.completed .checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox svg {
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 3;
            opacity: 0;
        }

        .task-item.completed .checkbox svg {
            opacity: 1;
        }

        .task-text {
            flex: 1;
            font-size: 14px;
        }

        .delete-btn {
            width: 28px;
            height: 28px;
            background: none;
            border: none;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.15s ease;
        }

        .task-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            color: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 14px;
        }

        footer {
            padding: 40px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            margin-top: 80px;
        }

        .footer-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            nav { padding: 0 16px; }
            main { padding: 100px 16px 40px; }
            .nav-links { display: none; }
            .page-header { flex-direction: column; gap: 24px; }
            .stats { width: 100%; }
            .stat { flex: 1; }
            .task-input-wrapper { flex-direction: column; }
            .add-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo"><span></span>Dashboard</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="calendar.html">Calendar</a>
            <a href="color.html">Colors</a>
            <a href="task.html" class="active">Tasks</a>
            <a href="MyTime/school_table.html">Schedule</a>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <div class="page-header-left">
                <p class="page-eyebrow">Productivity</p>
                <h1 class="page-title">Tasks</h1>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-count">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="done-count">0</div>
                    <div class="stat-label">Done</div>
                </div>
            </div>
        </header>

        <div class="task-input-wrapper">
            <input type="text" class="task-input" id="task-input" placeholder="Add a new task..." onkeypress="if(event.key === 'Enter') addTask()">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <div class="task-list" id="task-list"></div>
    </main>

    <footer>
        <p class="footer-text">Built with precision</p>
    </footer>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            updateCounts();
        }

        function updateCounts() {
            document.getElementById('total-count').textContent = tasks.length;
            document.getElementById('done-count').textContent = tasks.filter(t => t.completed).length;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        <p>No tasks yet. Add one above.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = tasks.map((task, index) => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="checkbox" onclick="toggleTask(${index})">
                        <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            `).join('');
            
            updateCounts();
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            
            if (text) {
                tasks.unshift({ text, completed: false, createdAt: Date.now() });
                saveTasks();
                renderTasks();
                input.value = '';
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        renderTasks();
    </script>
</body>
</html>
