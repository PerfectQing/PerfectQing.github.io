<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks — PerfectQing</title>
    <link rel="icon" href="style/images/home.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #111113;
            --bg-tertiary: #18181b;
            --bg-card: rgba(24, 24, 27, 0.6);
            --bg-card-hover: rgba(39, 39, 42, 0.8);
            --border-primary: rgba(63, 63, 70, 0.4);
            --border-hover: rgba(99, 102, 241, 0.5);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            padding: 24px 0;
            border-bottom: 1px solid var(--border-primary);
            backdrop-filter: blur(12px);
            background: rgba(10, 10, 11, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .brand-text h1 { font-size: 18px; font-weight: 600; }
        .brand-text p { font-size: 13px; color: var(--text-tertiary); }

        /* Navigation */
        nav { padding: 20px 0; }

        nav ul {
            display: flex;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 9999px;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
            border-color: var(--border-primary);
        }

        nav a.active {
            color: var(--accent-light);
            background: var(--accent-glow);
            border-color: var(--border-hover);
        }

        /* Main */
        main {
            padding: 48px 0 80px;
        }

        .page-header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .page-header h2 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .stats-badges {
            display: flex;
            gap: 12px;
        }

        .badge {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 9999px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge .count {
            font-weight: 600;
            color: var(--accent-light);
        }

        /* Task Input */
        .task-input-container {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 32px;
            display: flex;
            gap: 12px;
        }

        .task-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        .task-input::placeholder {
            color: var(--text-tertiary);
        }

        .task-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .add-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.4);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: var(--transition);
        }

        .task-item:hover {
            border-color: var(--border-hover);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-tertiary);
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-primary);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .checkbox:hover {
            border-color: var(--accent);
        }

        .task-item.completed .checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox svg {
            width: 14px;
            height: 14px;
            color: white;
            opacity: 0;
        }

        .task-item.completed .checkbox svg {
            opacity: 1;
        }

        .task-text {
            flex: 1;
            font-size: 15px;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            border-radius: 8px;
            color: var(--text-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
        }

        .task-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--text-tertiary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* Image Section */
        .image-section {
            margin-top: 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            padding: 24px;
        }

        .image-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .image-section img {
            width: 100%;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-primary);
        }

        /* Footer */
        .footer {
            padding: 32px 0;
            border-top: 1px solid var(--border-primary);
            text-align: center;
        }

        .footer a {
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--accent-light);
        }

        @media (max-width: 640px) {
            .page-header {
                flex-direction: column;
                gap: 20px;
            }
            .task-input-container {
                flex-direction: column;
            }
            .stats-badges {
                width: 100%;
            }
            .badge {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="brand">
                    <div class="logo">PQ</div>
                    <div class="brand-text">
                        <h1>PerfectQing</h1>
                        <p>Task Manager</p>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calendar.html">Calendar</a></li>
                <li><a href="task.html" class="active">Tasks</a></li>
                <li><a href="color.html">Colors</a></li>
                <li><a href="MyTime/school_table.html">Schedule</a></li>
                <li><a href="oldindex.html">Archive</a></li>
            </ul>
        </nav>

        <main>
            <div class="page-header">
                <div>
                    <h2>Tasks</h2>
                    <p>Organize your day with a simple task list.</p>
                </div>
                <div class="stats-badges">
                    <div class="badge">
                        <span>Total</span>
                        <span class="count" id="total-count">0</span>
                    </div>
                    <div class="badge">
                        <span>Done</span>
                        <span class="count" id="done-count">0</span>
                    </div>
                </div>
            </div>

            <div class="task-input-container">
                <input type="text" class="task-input" id="task-input" placeholder="Add a new task..." onkeypress="if(event.key === 'Enter') addTask()">
                <button class="add-btn" onclick="addTask()">Add Task</button>
            </div>

            <div class="task-list" id="task-list">
                <!-- Tasks will be rendered here -->
            </div>

            <section class="image-section">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    Reference
                </h3>
                <img src="Resources/requirement.png" alt="Reference Image">
            </section>
        </main>

        <footer class="footer">
            <a href="https://github.com/PerfectQing/PerfectQing.github.io" target="_blank">
                GitHub: PerfectQing/PerfectQing.github.io
            </a>
        </footer>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            updateCounts();
        }

        function updateCounts() {
            document.getElementById('total-count').textContent = tasks.length;
            document.getElementById('done-count').textContent = tasks.filter(t => t.completed).length;
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 11l3 3L22 4"></path>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        <p>No tasks yet. Add one above to get started!</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = tasks.map((task, index) => `
                <div class="task-item ${task.completed ? 'completed' : ''}" data-index="${index}">
                    <div class="checkbox" onclick="toggleTask(${index})">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            `).join('');
            
            updateCounts();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            
            if (text) {
                tasks.unshift({ text, completed: false, createdAt: Date.now() });
                saveTasks();
                renderTasks();
                input.value = '';
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        // Initial render
        renderTasks();
    </script>
</body>
</html>
